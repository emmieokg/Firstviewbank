<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Transactions | Firstviewbank</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="bank-pages.css">

  <style>

    .transaction-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .transaction-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid #e5e7eb;
      gap: 15px;
    }

    .transaction-item:last-child {
      border-bottom: none;
    }

    .transaction-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .transaction-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef4f9;
      color: #073b6b;
      flex-shrink: 0;
    }

    .transaction-name {
      font-weight: 600;
      color: #222;
      text-transform: capitalize;
    }

    .transaction-account {
      font-size: 13px;
      color: #777;
      margin-top: 3px;
      text-transform: capitalize;
    }

    .transaction-right {
      text-align: right;
    }

    .transaction-amount {
      font-weight: 700;
      white-space: nowrap;
    }

    .deposit {
      color: #16803c;
      font-weight: 600;
    }

    .withdrawal {
      color: #c82333;
      font-weight: 600;
    }

    .transaction-date {
      font-size: 12px;
      color: #777;
      margin-top: 4px;
      white-space: nowrap;
    }

    .empty {
      text-align: center;
      padding: 30px 15px;
      color: #777;
    }

  </style>

</head>


<body>

<main class="page-wrap">

  <a href="dashboard.html" class="back-link">
    <i class="fa-solid fa-arrow-left"></i>
    Back to Dashboard
  </a>


  <p class="page-subtitle">
    Review activity across your accounts.
  </p>


  <section class="card">

    <div id="transactionList" class="transaction-list">

      <div class="empty">
        Loading transactions...
      </div>

    </div>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  const transactionList =
    document.getElementById("transactionList");

  const {
    data: { session },
    error
  } = await window.supabaseClient.auth.getSession();

  if (error) {
    transactionList.innerHTML = `
      <div class="empty">
        ${error.message}
      </div>
    `;
    return;
  }

  if (!session) {
    transactionList.innerHTML = `
      <div class="empty">
        No active session.
      </div>
    `;
    return;
  }

  const user = session.user;

  transactionList.innerHTML = `
    <div class="empty">
      User found:<br><br>
      ${user.id}
    </div>
  `;

});
</script>

</body>
</html>
