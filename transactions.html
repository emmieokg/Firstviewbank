<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Transactions | Firstviewbank</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="bank-pages.css">

  <style>

    .transaction-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .transaction-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid #e5e7eb;
      gap: 15px;
    }

    .transaction-item:last-child {
      border-bottom: none;
    }

    .transaction-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .transaction-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef4f9;
      color: #073b6b;
      flex-shrink: 0;
    }

    .transaction-name {
      font-weight: 600;
      color: #222;
      text-transform: capitalize;
    }

    .transaction-account {
      font-size: 13px;
      color: #777;
      margin-top: 3px;
      text-transform: capitalize;
    }

    .transaction-right {
      text-align: right;
    }

    .transaction-amount {
      font-weight: 700;
      white-space: nowrap;
    }

    .deposit {
      color: #16803c;
      font-weight: 600;
    }

    .withdrawal {
      color: #c82333;
      font-weight: 600;
    }

    .transaction-date {
      font-size: 12px;
      color: #777;
      margin-top: 4px;
      white-space: nowrap;
    }

    .empty {
      text-align: center;
      padding: 30px 15px;
      color: #777;
    }

  </style>

</head>


<body>

<main class="page-wrap">

  <a href="dashboard.html" class="back-link">
    <i class="fa-solid fa-arrow-left"></i>
    Back to Dashboard
  </a>


  <p class="page-subtitle">
    Review activity across your accounts.
  </p>


  <section class="card">

    <div id="transactionList" class="transaction-list">

      <div class="empty">
        Loading transactions...
      </div>

    </div>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>

<script>
if (typeof supabaseClient !== "undefined") {
  window.supabaseClient = supabaseClient;
}
</script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  const list = document.getElementById("transactionList");

  try {

    const { data: sessionData, error: sessionError } =
      await window.supabaseClient.auth.getSession();

    if (sessionError) {
      throw sessionError;
    }

    const session = sessionData.session;

    if (!session) {
      list.innerHTML =
        '<div class="empty">Please log in again.</div>';
      return;
    }

    const userId = session.user.id;

    const { data, error } =
      await window.supabaseClient
        .from("transactions")
        .select("*")
        .eq("user_id", userId)
        .order("created_at", { ascending: false });

    if (error) {
      throw error;
    }

    if (!data || data.length === 0) {
      list.innerHTML =
        '<div class="empty">No transactions yet.</div>';
      return;
    }

    list.innerHTML = "";

    data.forEach(transaction => {

      const isDeposit =
        transaction.transaction_type === "deposit";

      const amount =
        Number(transaction.amount).toLocaleString("en-US", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });

      const date =
        new Date(transaction.created_at).toLocaleString("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric",
          hour: "numeric",
          minute: "2-digit"
        });

      list.innerHTML += `
        <div class="transaction-item">

          <div class="transaction-left">

            <div class="transaction-icon">
              <i class="fa-solid ${
                isDeposit
                  ? "fa-arrow-down"
                  : "fa-arrow-up"
              }"></i>
            </div>

            <div>
              <div class="transaction-name">
                ${transaction.transaction_type}
              </div>

              <div class="transaction-account">
                ${transaction.account_type} account
              </div>
            </div>

          </div>

          <div class="transaction-right">

            <div class="transaction-amount ${
              isDeposit ? "deposit" : "withdrawal"
            }">
              ${isDeposit ? "+" : "-"}$${amount}
            </div>

            <div class="transaction-date">
              ${date}
            </div>

          </div>

        </div>
      `;

    });

  } catch (error) {

    console.error("Transactions:", error);

    list.innerHTML = `
  <div class="empty">
    Error:<br><br>
    ${error.message}
  </div>
`;

  }

});
</script>

</body>
</html>
