<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cards | Firstviewbank</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="bank-pages.css">

</head>

<body>

<main class="page-wrap">

  <a href="dashboard.html" class="back-link">
    <i class="fa-solid fa-arrow-left"></i>
    Back to Dashboard
  </a>

  <p class="page-subtitle">
    Manage your Firstviewbank cards.
  </p>


  <section class="card no-card-card">

    <div class="no-card-icon">
      <i class="fa-regular fa-credit-card"></i>
    </div>

    <h2 class="card-title">
      You don’t have a card yet.
    </h2>

    <p class="no-card-text">
      Choose a card type below to submit a request.
    </p>


    <form
      onsubmit="
        event.preventDefault();
        alert('Your card request has been submitted for review.');
      "
    >

      <div class="field full">

        <label for="cardType">
          Choose card
        </label>

        <select
          id="cardType"
          name="cardType"
          required
        >

          <option value="" disabled selected>
            Select card type
          </option>

          <option value="credit-card">
            Credit Card
          </option>

          <option value="debit-card">
            Debit Card
          </option>

        </select>

      </div>


      <button
        type="submit"
        class="primary-btn"
      >
        Submit Request
      </button>

    </form>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>

<script>

document.addEventListener("DOMContentLoaded", async () => {

  if (typeof requireAuth === "function") {
    await requireAuth();
  }

});

</script>


<style>

.no-card-card {
  text-align: center;
  padding: 45px 30px;
}

.no-card-icon {
  width: 65px;
  height: 65px;
  margin: 0 auto 20px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: #eef4f8;
  color: #073b6b;

  font-size: 28px;
}

.no-card-card .card-title {
  margin-bottom: 10px;
}

.no-card-text {
  margin: 0 auto 28px;
  color: #666;
  font-size: 14px;
}

.no-card-card form {
  max-width: 420px;
  margin: 0 auto;
  text-align: left;
}

.no-card-card .field {
  margin-bottom: 22px;
}

.no-card-card .field label {
  display: block;
  margin-bottom: 5px;
}

.no-card-card select {
  width: 100%;
  min-height: 48px;
  padding: 0 14px;

  border: 1px solid #ccc;
  border-radius: 4px;

  background: #fff;
  color: #333;

  font-size: 15px;
}

.no-card-card .primary-btn {
  width: 100%;
}

</style>

</body>
</html>
