<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Credit Card | Firstviewbank</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="bank-pages.css">

</head>


</header>


<main class="page-wrap">

  <a href="dashboard.html" class="back-link">
    <i class="fa-solid fa-arrow-left"></i>
    Back to Dashboard
  </a>


  <p class="page-subtitle">
    View your card information, available credit and activity.
  </p>


  <section class="card">

    <div class="account-summary">

      <div>

        <small>
          Current balance
        </small>

        <div class="account-balance">
          $0.00
        </div>

        <small>
          Card ending ••••
        </small>

      </div>


      <a
        href="bills.html"
        class="summary-action"
      >
        Pay Card
      </a>

    </div>


    <div class="profile-grid">

      <div class="info-box">

        <span>
          Available credit
        </span>

        <strong>
          $0.00
        </strong>

      </div>


      <div class="info-box">

        <span>
          Payment due
        </span>

        <strong>
          $0.00
        </strong>

      </div>


      <div class="info-box">

        <span>
          Minimum payment
        </span>

        <strong>
          $0.00
        </strong>

      </div>


      <div class="info-box">

        <span>
          Status
        </span>

        <strong>
          Active
        </strong>

      </div>

    </div>

  </section>


  <section class="card">

    <h2 class="card-title">
      Card Activity
    </h2>

    <div class="empty">
      No card transactions to display.
    </div>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>

<script>

document.addEventListener("DOMContentLoaded", async () => {

  if (typeof requireAuth === "function") {
    await requireAuth();
  }

});

</script>

</body>
</html>
