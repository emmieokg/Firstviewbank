<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Profile | Firstviewbank</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="bank-pages.css">

</head>

<body>


<main class="page-wrap">

  <a href="dashboard.html" class="back-link">
    <i class="fa-solid fa-arrow-left"></i>
    Back to Dashboard
  </a>


  <h1 class="page-title">
    Profile
  </h1>


  <!-- PERSONAL INFORMATION -->

  <section class="card">

    <h2 class="card-title">
      Personal Information
    </h2>


    <div class="profile-grid">

      <div class="info-box">

        <span>
          First name
        </span>

        <strong id="profileFirstName">
          Customer
        </strong>

      </div>


      <div class="info-box">

        <span>
          Last name
        </span>

        <strong id="profileLastName">
          —
        </strong>

      </div>


      <div class="info-box">

        <span>
          Email address
        </span>

        <strong id="profileEmail">
          —
        </strong>

      </div>

      <div class="info-box">

  <span>
    Account type
  </span>

  <strong id="profileAccountType">
    —
  </strong>

</div>

    </div>

  </section>


  <!-- CHANGE PASSWORD -->

  <section class="card">

    <h2 class="card-title">
      Change Password
    </h2>

    <p class="page-subtitle">
      Update the password used to sign in to your account.
    </p>


  <form
  id="changePasswordForm"
  onsubmit="changePassword(event)"
>

  <!-- CURRENT PASSWORD -->

  <div class="field full">

    <label for="currentPassword">
      Current password
    </label>

    <div class="password-input">

      <input
        type="password"
        id="currentPassword"
        autocomplete="current-password"
        required
      >

      <button
        type="button"
        onclick="togglePassword('currentPassword', this)"
        aria-label="Show password"
      >
        <i class="fa-regular fa-eye"></i>
      </button>

    </div>

  </div>


  <!-- NEW PASSWORD -->

  <div class="field full">

    <label for="newPassword">
      New password
    </label>

    <div class="password-input">

      <input
        type="password"
        id="newPassword"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button
        type="button"
        onclick="togglePassword('newPassword', this)"
        aria-label="Show password"
      >
        <i class="fa-regular fa-eye-slash"></i>
      </button>

    </div>

  </div>


  <!-- CONFIRM NEW PASSWORD -->

  <div class="field full">

    <label for="confirmNewPassword">
      Confirm new password
    </label>

    <div class="password-input">

      <input
        type="password"
        id="confirmNewPassword"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button
        type="button"
        onclick="togglePassword('confirmNewPassword', this)"
        aria-label="Show password"
      >
        <i class="fa-regular fa-eye-slash"></i>
      </button>

    </div>

  </div>


  <div
    id="passwordMessage"
    class="password-message"
  ></div>


  <div class="form-actions">

    <button
      class="primary-btn"
      type="submit"
      id="changePasswordButton"
    >
      Change Password
    </button>

  </div>

</form>
  </section>


  <!-- ACCOUNT ACTIONS -->

  <section class="card">


    <div class="form-actions">

      <button
        class="secondary-btn"
        type="button"
        onclick="logoutUser()"
      >
        Sign Out
      </button>

    </div>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>


<script>

(async function () {

  if (typeof requireAuth !== "function") {
    return;
  }

  const user = await requireAuth();

  if (!user) {
    return;
  }

  const metadata = user.user_metadata || {};

  document.getElementById("profileFirstName").textContent =
    metadata.first_name || "Customer";

  document.getElementById("profileLastName").textContent =
    metadata.last_name || "—";

  document.getElementById("profileEmail").textContent =
    user.email || "—";

    document.getElementById("profileAccountType").textContent =
  metadata.account_type || "—";

})();


async function changePassword(event) {

  event.preventDefault();

  const currentPassword =
    document.getElementById("currentPassword").value;

  const newPassword =
    document.getElementById("newPassword").value;

  const confirmNewPassword =
    document.getElementById("confirmNewPassword").value;

  const message =
    document.getElementById("passwordMessage");

  const button =
    document.getElementById("changePasswordButton");


  message.textContent = "";
  message.style.color = "#c82333";


  if (newPassword.length < 8) {

    message.textContent =
      "New password must be at least 8 characters.";

    return;

  }


  if (newPassword !== confirmNewPassword) {

    message.textContent =
      "New passwords do not match.";

    return;

  }


  button.disabled = true;
  button.textContent = "Changing Password...";


  try {

    const {
      data: {
        user
      }
    } = await supabaseClient.auth.getUser();


    if (!user || !user.email) {

      throw new Error(
        "Unable to verify your account."
      );

    }


    const {
      error: signInError
    } = await supabaseClient.auth.signInWithPassword({

      email: user.email,

      password: currentPassword

    });


    if (signInError) {

      throw new Error(
        "Current password is incorrect."
      );

    }


    const {
      error: updateError
    } = await supabaseClient.auth.updateUser({

      password: newPassword

    });


    if (updateError) {

      throw updateError;

    }


    message.style.color = "#137333";

    message.textContent =
      "Your password has been changed successfully.";


    document
      .getElementById("changePasswordForm")
      .reset();


  } catch (error) {

    console.error(
      "Password change error:",
      error
    );

    message.style.color = "#c82333";

    message.textContent =
      error.message ||
      "Unable to change your password.";

  } finally {

    button.disabled = false;
    button.textContent = "Change Password";

  }

}


/* SHOW / HIDE PASSWORD */

function togglePassword(inputId, button) {

  const input =
    document.getElementById(inputId);

  const icon =
    button.querySelector("i");


  if (input.type === "password") {

    input.type = "text";

    icon.classList.add("fa-eye");
    icon.classList.remove("fa-eye-slash");

    button.setAttribute(
      "aria-label",
      "Hide password"
    );

  } else {

    input.type = "password";

    icon.classList.add("fa-eye-slash");
    icon.classList.remove("fa-eye");

    button.setAttribute(
      "aria-label",
      "Show password"
    );

  }

}
</script>


<style>

.password-message {
  min-height: 20px;
  margin-top: 10px;
  font-size: 13px;
}
.password-input {
  position: relative;
}

.password-input input {
  padding-right: 45px !important;
}

.password-input button {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);

  border: none;
  background: transparent;

  color: #666;
  cursor: pointer;

  font-size: 16px;
}

.password-input button:hover {
  color: #073b6b;
}

#changePasswordForm .field {
  margin-bottom: 20px;
}

#changePasswordForm .field label {
  display: block;
  margin-bottom: 5px;
}

#changePasswordForm input {
  width: 100%;
  box-sizing: border-box;
  min-height: 48px;
  padding: 0 14px;
  border: 1px solid #ccc;
  border-radius: 4px;
  background: #fff;
  color: #222;
  font-size: 15px;
}

#changePasswordForm input:focus {
  outline: none;
  border-color: #073b6b;
}

</style>


</body>
</html>
