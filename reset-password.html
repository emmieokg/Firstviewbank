<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | Firstviewbank</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f4f6f8;
      color: #222;
      font-family: "Inter", Arial, sans-serif;
    }

    .auth-header {
      height: 70px;
      background: #fff;
      padding: 0 5%;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #073b6b;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .back-button:hover {
      opacity: 0.8;
    }

    .reset-container {
      min-height: calc(100vh - 70px);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 20px;
    }

    .reset-card {
      width: 100%;
      max-width: 450px;
      background: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    .reset-card h1 {
      color: #073b6b;
      font-size: 28px;
      margin-bottom: 12px;
    }

    .reset-card p {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #073b6b;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      width: 100%;
      padding: 13px 45px 13px 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    .password-wrapper input:focus {
      border-color: #073b6b;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #073b6b;
      cursor: pointer;
      font-size: 15px;
    }

    .reset-button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #073b6b;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .reset-button:hover {
      opacity: 0.9;
    }

    .reset-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back-login {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #073b6b;
      font-size: 14px;
      text-decoration: none;
    }

    .back-login:hover {
      text-decoration: underline;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      border-radius: 3px;
    }

    .message.success {
      display: block;
      background: #eaf7ee;
      color: #176b35;
      border: 1px solid #b9dfc4;
    }

    .message.error {
      display: block;
      background: #fdecec;
      color: #a51d2d;
      border: 1px solid #efb7bd;
    }

    @media (max-width: 600px) {
      .auth-header {
        height: 62px;
        padding: 0 20px;
      }

      .reset-container {
        min-height: calc(100vh - 62px);
        padding: 30px 15px;
      }

      .reset-card {
        padding: 30px 22px;
      }

      .reset-card h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <header class="auth-header">
    <a href="login.html" class="back-button">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Back to Sign In</span>
    </a>
  </header>

  <main class="reset-container">

    <section class="reset-card">

      <h1>Reset Password</h1>

      <p>
        Create a new password for your Firstviewbank account.
      </p>

      <form id="resetForm">

        <div class="form-group">
          <label for="password">New Password</label>

          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              placeholder="Enter new password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="toggle-password"
              onclick="togglePassword('password', this)"
              aria-label="Show password"
            >
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>

          <div class="password-wrapper">
            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm new password"
              minlength="6"
              required
            >

            <button
              type="button"
              class="toggle-password"
              onclick="togglePassword('confirmPassword', this)"
              aria-label="Show password"
            >
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="reset-button"
          id="resetButton"
        >
          Update Password
        </button>

      </form>

      <div id="message" class="message"></div>

      <a href="login.html" class="back-login">
        Back to Sign In
      </a>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://qdtjuvtcairdskrppnaa.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_4gCpAyujXlfZ0rsdHkzVzg_VxqpC0qQ";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("resetForm");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const resetButton = document.getElementById("resetButton");
    const message = document.getElementById("message");

    function togglePassword(inputId, button) {
      const input = document.getElementById(inputId);
      const icon = button.querySelector("i");

      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      message.className = "message";
      message.textContent = "";

      if (password.length < 6) {
        message.textContent =
          "Your password must be at least 6 characters long.";
        message.classList.add("error");
        return;
      }

      if (password !== confirmPassword) {
        message.textContent =
          "The passwords do not match.";
        message.classList.add("error");
        return;
      }

      resetButton.disabled = true;
      resetButton.textContent = "Updating...";

      const { error } = await supabaseClient.auth.updateUser({
        password: password
      });

      if (error) {
        message.textContent = error.message;
        message.classList.add("error");

        resetButton.disabled = false;
        resetButton.textContent = "Update Password";
        return;
      }

      message.textContent =
        "Your password has been updated successfully. You can now sign in with your new password.";

      message.classList.add("success");

      form.reset();

      resetButton.disabled = false;
      resetButton.textContent = "Password Updated";
    });
  </script>

</body>
</html>
