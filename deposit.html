<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>

  <title>Deposit | Firstviewbank</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="bank-pages.css">

</head>

</header>


<main class="page-wrap">

  <a href="dashboard.html" class="back-link">
    <i class="fa-solid fa-arrow-left"></i>
    Back to Dashboard
  </a>


  <p class="page-subtitle">
    Add money to your Firstviewbank accounts.
  </p>


  <section class="card">

    <h2 class="card-title">
      Deposit Details
    </h2>


    <form
      onsubmit="
        event.preventDefault();
        alert('Deposit is not connected to a real payment or banking provider yet.');
      "
    >

      <div class="form-grid">

        <div class="field full">

          <label for="depositAccount">
            Deposit into
          </label>

          <select id="depositAccount">

            <option>
              Checking Account
            </option>

            <option>
              Savings Account
            </option>

          </select>

        </div>


        <div class="field">

          <label for="depositMethod">
            Deposit method
          </label>

          <select id="depositMethod">

            <option>
              Bank transfer
            </option>

            <option>
              Debit card
            </option>

          </select>

        </div>


        <div class="field">

          <label for="depositAmount">
            Amount
          </label>

          <input
            id="depositAmount"
            type="number"
            min="0"
            step="0.01"
            placeholder="0.00"
            required
          >

        </div>

      </div>


      <div class="form-actions">

        <button
          class="primary-btn"
          type="submit"
        >
          Continue
        </button>

        <a
          class="secondary-btn"
          href="dashboard.html"
        >
          Cancel
        </a>

      </div>

    </form>

  </section>

</main>


<footer class="page-footer">
  © 2026 Firstviewbank
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>

<script>

document.addEventListener("DOMContentLoaded", async () => {

  if (typeof requireAuth === "function") {
    await requireAuth();
  }

});

</script>

</body>
</html>
