<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Email Verified | Firstviewbank</title>

  <link rel="stylesheet" href="style.css">

  <style>

    body {
      background: #f5f7f9;
    }

    .verified-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    .verified-box {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 40px 35px;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      text-align: center;
    }

    .verified-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #eaf7ee;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #137333;
      font-size: 32px;
      font-weight: bold;
    }

    .verified-box h1 {
      color: #073b6b;
      font-size: 25px;
      margin-bottom: 12px;
    }

    .verified-box p {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      margin: 8px 0;
    }

    .verified-button {
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 25px;
      padding: 14px;
      border-radius: 10px;
      background: #073b6b;
      color: white;
      font-weight: bold;
      text-decoration: none;
    }

    .verified-button:hover {
      opacity: 0.9;
    }

  </style>

</head>

<body>

  <main class="verified-page">

    <div class="verified-box">

      <div class="verified-icon">
        ✓
      </div>

      <h1>Email Verified</h1>

      <p>
        Your email address has been successfully verified.
      </p>

      <p>
        Redirecting you to the sign in page...
      </p>

      <a
        href="login.html"
        class="verified-button"
      >
        Continue to Sign In
      </a>

    </div>

  </main>


  <script>

    setTimeout(() => {

      window.location.href =
        "login.html";

    }, 2000);

  </script>

</body>

</html>
