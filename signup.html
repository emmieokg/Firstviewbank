<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | Firstviewbank</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #f5f7f9;
    }

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    .auth-box {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 35px;
      border-radius: 5px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    .auth-box h1 {
      color: #073b6b;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .auth-subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .auth-box label {
      display: block;
      font-size: 13px;
      margin: 15px 0 6px;
    }

    .auth-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #bbb;
      border-radius: 3px;
      font-size: 14px;
    }

    .auth-button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: 0;
      border-radius: 3px;
      background: #073b6b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .auth-button:hover {
      opacity: 0.9;
    }

    .auth-message {
      min-height: 20px;
      margin-top: 15px;
      font-size: 13px;
    }

    .auth-footer {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #666;
    }

    .auth-footer a {
      color: #075b91;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="auth-page">

    <div class="auth-box">

      <h1>Create Account</h1>

      <p class="auth-subtitle">
          Create your Firstviewbank account.
      </p>

      <form onsubmit="event.preventDefault(); signUpUser();">

        <label for="firstName">First Name</label>
        <input
          type="text"
          id="firstName"
          autocomplete="given-name"
          required
        >

        <label for="lastName">Last Name</label>
        <input
          type="text"
          id="lastName"
          autocomplete="family-name"
          required
        >

        <label for="signupEmail">Email Address</label>
        <input
          type="email"
          id="signupEmail"
          autocomplete="email"
          required
        >

        <label for="signupPassword">Password</label>
        <input
          type="password"
          id="signupPassword"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          autocomplete="new-password"
          minlength="8"
          required
        >

       <button type="button" class="auth-button" onclick="window.location.href='dashboard.html'">
  Create Account
</button>

        <div id="signupMessage" class="auth-message"></div>

      </form>

      <div class="auth-footer">
        Already have an account?
        <a href="login.html">Sign In</a>
      </div>

    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>

</body>
</html>
