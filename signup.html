<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | Firstviewbank</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #f5f7f9;
    }

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }
     
    .auth-box {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 35px;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    .auth-box h1 {
      color: #073b6b;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .required {
      color: #c82333;
      font-weight: 600;
}

    .auth-subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .auth-box label {
      display: block;
      font-size: 13px;
      margin: 15px 0 6px;
    }

    .auth-box input,
    .auth-box select {
      width: 100%;
      padding: 13px;
      box-sizing: border-box;
      border: 1px solid #bbb;
      border-radius: 10px;
      font-size: 14px;
      background: white;
      color: #222;
    }
  
    .auth-box input[type="date"] {
  width: 94%;
  box-sizing: border-box;

}
    
    .auth-button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #073b6b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .auth-button:hover {
      opacity: 0.9;
    }

    .auth-message {
      min-height: 20px;
      margin-top: 15px;
      font-size: 13px;
    }

    .auth-footer {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #666;
    }

    .auth-footer a {
      color: #075b91;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="auth-page">

    <div class="auth-box">

      <h1>Create Account</h1>

      <form onsubmit="event.preventDefault(); signUpUser();">

        <!-- Account Type -->
        <label for="accountType">Account Type: <span class="required">*</span></label>
        <select id="accountType" required>
          <option value="" disabled selected>Select account type</option>
          <option value="checking">Checking</option>
          <option value="savings">Savings</option>
          <option value="investment">Investment</option>
        </select>

        <!-- First Name -->
        <label for="firstName">First Name: <span class="required">*</span></label>
        <input
          type="text"
          id="firstName"
          autocomplete="given-name"
          required
        >

        <!-- Last Name -->
        <label for="lastName">Last Name: <span class="required">*</span></label>
        <input
          type="text"
          id="lastName"
          autocomplete="family-name"
          required
        >

        <!-- Date of Birth -->
        <label for="dateOfBirth">Date of Birth: <span class="required">*</span></label>
        <input
          type="date"
          id="dateOfBirth"
          autocomplete="bday"
          required
        >

        <!-- Home Address -->
        <label for="homeAddress">Home Address: <span class="required">*</span></label>
        <input
          type="text"
          id="homeAddress"
          autocomplete="street-address"
          placeholder="Enter your home address"
          required
        >

        <!-- Email -->
        <label for="signupEmail">Email Address: <span class="required">*</span></label>
        <input
          type="email"
          id="signupEmail"
          autocomplete="email"
          required
        >

        <!-- Password -->
        <label for="signupPassword">Password: <span class="required">*</span></label>
        <input
          type="password"
          id="signupPassword"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <!-- Confirm Password -->
        <label for="confirmPassword">Confirm Password: <span class="required">*</span></label>
        <input
          type="password"
          id="confirmPassword"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <button type="submit" class="auth-button">
          Create Account
        </button>

        <div id="signupMessage" class="auth-message"></div>

      </form>

      <div class="auth-footer">
        Already have an account?
        <a href="login.html">Sign In</a>
      </div>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>

</body>
</html>
