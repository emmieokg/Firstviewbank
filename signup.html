<!DOCTYPE html>
<html lang="en">

<head>
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | Firstviewbank</title>

  <link rel="stylesheet" href="style.css">

  <style>

    body {
      background: #f5f7f9;
    }

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    .auth-box {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 35px;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }
    
    .back-home {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: #073b6b;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  margin-bottom: 25px;
}

.back-home i {
  font-size: 13px;
}

.back-home:hover {
  opacity: 0.8;
}

    .auth-box h1 {
      color: #073b6b;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .required {
      color: #c82333;
      font-weight: 600;
    }

    .auth-subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .auth-box label {
      display: block;
      font-size: 13px;
      margin: 15px 0 6px;
    }

    .auth-box input,
    .auth-box select {
      width: 100%;
      padding: 13px;
      box-sizing: border-box;
      border: 1px solid #bbb;
      border-radius: 10px;
      font-size: 14px;
      background: white;
      color: #222;
    }

    .auth-box input[type="date"] {
      width: 94%;
    }

    .auth-button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #073b6b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .auth-button:hover {
      opacity: 0.9;
    }

    .auth-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .auth-message {
      min-height: 20px;
      margin-top: 15px;
      font-size: 13px;
    }

    .auth-footer {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #666;
    }

    .auth-footer a {
      color: #075b91;
      font-weight: bold;
    }
    .password-input {
  position: relative;
}

.password-input input {
  padding-right: 45px !important;
}

.password-input button {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);

  border: none;
  background: transparent;

  color: #666;
  cursor: pointer;

  font-size: 16px;
}

.password-input button:hover {
  color: #073b6b;
}

  </style>

</head>

<body>

  <main class="auth-page">

    <div class="auth-box">

<a href="index.html" class="back-home">
  <i class="fa-solid fa-arrow-left"></i>
  Back to Homepage
</a>

      <h1>Create Account</h1>

      <form onsubmit="event.preventDefault(); signUpUser();">

        <label for="accountType">
          Account Type:
          <span class="required">*</span>
        </label>

        <select id="accountType" required>

          <option value="" disabled selected>
            Select account type
          </option>

          <option value="checking">
            Checking
          </option>

          <option value="savings">
            Savings
          </option>

          <option value="investment">
            Investment
          </option>

        </select>


        <label for="firstName">
          First Name:
          <span class="required">*</span>
        </label>

        <input
          type="text"
          id="firstName"
          autocomplete="given-name"
          required
        >


        <label for="lastName">
          Last Name:
          <span class="required">*</span>
        </label>

        <input
          type="text"
          id="lastName"
          autocomplete="family-name"
          required
        >


        <label for="dateOfBirth">
          Date of Birth:
          <span class="required">*</span>
        </label>

        <input
          type="date"
          id="dateOfBirth"
          autocomplete="bday"
          required
        >


        <label for="signupEmail">
          Email Address:
          <span class="required">*</span>
        </label>

        <input
          type="email"
          id="signupEmail"
          autocomplete="email"
          required
        >


        <label for="signupPassword">
  Password: <span class="required">*</span>
</label>

<div class="password-input">

  <input
    type="password"
    id="signupPassword"
    autocomplete="new-password"
    minlength="8"
    required
  >

  <button
    type="button"
    onclick="togglePassword('signupPassword', this)"
    aria-label="Show password"
  >
    <i class="fa-regular fa-eye"></i>
  </button>

</div>


<label for="confirmPassword">
  Confirm Password: <span class="required">*</span>
</label>

<div class="password-input">

  <input
    type="password"
    id="confirmPassword"
    autocomplete="new-password"
    minlength="8"
    required
  >

  <button
    type="button"
    onclick="togglePassword('confirmPassword', this)"
    aria-label="Show password"
  >
    <i class="fa-regular fa-eye"></i>
  </button>

</div>


        <button
          type="submit"
          class="auth-button"
          id="signupButton"
        >
          Create Account
        </button>

        <div
          id="signupMessage"
          class="auth-message"
        ></div>

      </form>


      <div class="auth-footer">

        Already have an account?

        <a href="login.html">
          Sign In
        </a>

      </div>

    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="auth.js"></script>
  <script>

function togglePassword(inputId, button) {

  const input = document.getElementById(inputId);
  const icon = button.querySelector("i");

  if (input.type === "password") {

    input.type = "text";

    icon.classList.remove("fa-eye-slash");
    icon.classList.add("fa-eye");
    

    button.setAttribute("aria-label", "Hide password");

  } else {

    input.type = "password";

    
    icon.classList.remove("fa-eye");
    icon.classList.add("fa-eye-slash");

    button.setAttribute("aria-label", "Show password");

  }

}

</script>

</body>

</html>
