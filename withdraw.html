<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Withdraw | Firstviewbank</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="bank-pages.css">
</head>
</header>


<main class="page-wrap">

  <a href="dashboard.html" class="back-link">
    <i class="fa-solid fa-arrow-left"></i>
    Back to Dashboard
  </a>

  <p class="page-subtitle">
    Withdraw money to an external bank account.
  </p>


  <section class="card">

    <h2 class="card-title">
      Withdrawal Details
    </h2>


    <form onsubmit="
      event.preventDefault();
      alert('Withdrawals are not connected to a real banking provider yet.');
    ">

     <div class="form-grid">
        <div class="field">
          <label for="withdrawAccount">
            From account
          </label>
          <select id="withdrawAccount">
            <option>
              Checking Account
            </option>
            <option>
              Savings Account
            </option>
          </select>
        </div>

      <!-- BANK NAME -->

      <div class="field full">

        <label for="bankName">
          Bank Name
        </label>

        <div class="bank-select">

          <button
            type="button"
            id="bankSelector"
            class="bank-selector"
            onclick="openBankPopup()"
          >
            <span id="selectedBank">
              Select a bank
            </span>

            <i class="fa-solid fa-chevron-down"></i>
          </button>

        </div>

        <input
          type="hidden"
          id="bankName"
          name="bankName"
        >

      </div>


      <!-- ROUTING NUMBER -->

      <div class="field full">

        <label for="routingNumber">
          Routing Number
        </label>

        <input
          id="routingNumber"
          name="routingNumber"
          type="text"
          inputmode="numeric"
          placeholder="Enter routing number"
          autocomplete="off"
          required
        >

      </div>


      <!-- AMOUNT LAST -->

      <div class="field full">

        <label for="withdrawAmount">
          Amount
        </label>

        <input
          id="withdrawAmount"
          name="withdrawAmount"
          type="number"
          min="0"
          step="0.01"
          placeholder="0.00"
          required
        >

      </div>


      <div class="form-actions">

        <button
          class="primary-btn"
          type="submit"
        >
          Continue
        </button>

        <a
          class="secondary-btn"
          href="dashboard.html"
        >
          Cancel
        </a>

      </div>

    </form>

  </section>

</main>


<!-- BANK POPUP -->

<div
  id="bankPopup"
  class="bank-popup-overlay"
  onclick="closeBankPopup(event)"
>

  <div
    class="bank-popup"
    onclick="event.stopPropagation()"
  >

    <div class="bank-popup-header">

      <h2>
        Select Bank
      </h2>

      <button
        type="button"
        class="bank-popup-close"
        onclick="closeBankPopup()"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>

    </div>


    <div class="bank-search">

      <i class="fa-solid fa-magnifying-glass"></i>

      <input
        type="search"
        id="bankSearch"
        placeholder="Search bank name..."
        oninput="filterBanks()"
        autocomplete="off"
      >

    </div>


    <div class="bank-list" id="bankList">


      <!-- AMERICA -->

      <div class="bank-region">
        United States
      </div>

      <button
        type="button"
        class="bank-option"
        onclick="selectBank('Bank of America')"
      >
        Bank of America
      </button>

      <button
        type="button"
        class="bank-option"
        onclick="selectBank('JPMorgan Chase')"
      >
        JPMorgan Chase
      </button>

      <button
        type="button"
        class="bank-option"
        onclick="selectBank('Wells Fargo')"
      >
        Wells Fargo
      </button>

      <button
        type="button"
        class="bank-option"
        onclick="selectBank('Citibank')"
      >
        Citibank
      </button>

      <button
        type="button"
        class="bank-option"
        onclick="selectBank('U.S. Bank')"
      >
        U.S. Bank
      </button>

      <button
        type="button"
        class="bank-option"
        onclick="selectBank('PNC Bank')"
      >
        PNC Bank
      </button>


      <!-- EUROPE -->

      <div class="bank-region">
        Europe
      </div>

      <button
        type="button"
        class="bank-option"
        onclick="selectBank('Barclays')"
      >
        Barclays
      </button>

      <button
        type="button"
        class="bank-option"
        onclick="selectBank('HSBC')"
      >
        HSBC
      </button>

      <button
        type="button"
        class="bank-option"
        onclick="selectBank('Deutsche Bank')"
      >
        Deutsche Bank
      </button>

      <button
        type="button"
        class="bank-option"
        onclick="selectBank('BNP Paribas')"
      >
        BNP Paribas
      </button>

      <button
        type="button"
        class="bank-option"
        onclick="selectBank('Santander')"
      >
        Santander
      </button>

      <button
        type="button"
        class="bank-option"
        onclick="selectBank('ING')"
      >
        ING
      </button>


      <!-- MANUAL -->

      <div class="bank-region">
        Other
      </div>

      <button
        type="button"
        class="bank-option manual-bank"
        onclick="enterBankManually()"
      >
        <i class="fa-solid fa-pen"></i>
        Enter bank name manually
      </button>


    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/auth.js"></script>


<script>

document.addEventListener("DOMContentLoaded", async () => {

  if (typeof requireAuth === "function") {
    await requireAuth();
  }

});


function openBankPopup() {

  const popup = document.getElementById("bankPopup");

  popup.classList.add("open");

  document.getElementById("bankSearch").value = "";

  filterBanks();

  setTimeout(() => {
    document.getElementById("bankSearch").focus();
  }, 100);

}


function closeBankPopup(event) {

  if (
    event &&
    event.target !== document.getElementById("bankPopup")
  ) {
    return;
  }

  document
    .getElementById("bankPopup")
    .classList.remove("open");

}


function selectBank(bankName) {

  document.getElementById("selectedBank").textContent =
    bankName;

  document.getElementById("bankName").value =
    bankName;

  closeBankPopup();

}


function enterBankManually() {

  const bankName = prompt(
    "Enter the bank name:"
  );

  if (!bankName) {
    return;
  }

  const trimmedName = bankName.trim();

  if (!trimmedName) {
    return;
  }

  selectBank(trimmedName);

}


function filterBanks() {

  const search =
    document
      .getElementById("bankSearch")
      .value
      .toLowerCase()
      .trim();

  const options =
    document.querySelectorAll(".bank-option");

  options.forEach(option => {

    const bankName =
      option.textContent
        .toLowerCase()
        .trim();

    if (bankName.includes(search)) {
      option.style.display = "flex";
    } else {
      option.style.display = "none";
    }

  });

}


</script>


<style>

.bank-selector {
  width: 100%;
  min-height: 48px;
  padding: 0 14px;
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  font-size: 15px;
  color: #333;
}

.bank-selector i {
  color: #666;
}

.bank-popup-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 2000;

  opacity: 0;
  visibility: hidden;
  transition: .2s ease;
}

.bank-popup-overlay.open {
  opacity: 1;
  visibility: visible;
}

.bank-popup {
  width: 100%;
  max-width: 500px;
  max-height: 80vh;
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 15px 40px rgba(0,0,0,.25);
}

.bank-popup-header {
  padding: 18px 20px;
  border-bottom: 1px solid #ddd;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.bank-popup-header h2 {
  margin: 0;
  font-size: 20px;
  color: #073b6b;
}

.bank-popup-close {
  border: none;
  background: transparent;
  font-size: 24px;
  cursor: pointer;
  color: #555;
}

.bank-search {
  padding: 15px 20px;
  border-bottom: 1px solid #eee;
  position: relative;
}

.bank-search i {
  position: absolute;
  left: 34px;
  top: 31px;
  color: #888;
}

.bank-search input {
  width: 100%;
  height: 45px;
  padding: 0 14px 0 40px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 15px;
  outline: none;
}

.bank-search input:focus {
  border-color: #073b6b;
}

.bank-list {
  max-height: 55vh;
  overflow-y: auto;
}

.bank-region {
  padding: 12px 20px;
  background: #f5f6f8;
  color: #666;
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
}

.bank-option {
  width: 100%;
  padding: 15px 20px;
  border: none;
  border-bottom: 1px solid #eee;
  background: #fff;
  text-align: left;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
}

.bank-option:hover {
  background: #f5f8fb;
}

.manual-bank {
  color: #073b6b;
  font-weight: bold;
}

@media (max-width: 500px) {

  .bank-popup {
    max-height: 85vh;
  }

  .bank-list {
    max-height: 60vh;
  }

}

</style>

</body>
</html>
