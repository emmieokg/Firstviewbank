<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Withdraw | Firstviewbank</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="bank-pages.css">

</head>

</header>


<main class="page-wrap">

  <a href="dashboard.html" class="back-link">
    <i class="fa-solid fa-arrow-left"></i>
    Back to Dashboard
  </a>

  <p class="page-subtitle">
    Move available funds from your account to an eligible destination.
  </p>

  <section class="card">

    <h2 class="card-title">
      Withdrawal Details
    </h2>

    <form
      onsubmit="
        event.preventDefault();
        alert('Withdrawal is not connected to a real banking provider yet.');
      "
    >

      <div class="form-grid">

        <div class="field">

          <label for="withdrawAccount">
            From account
          </label>

          <select id="withdrawAccount">

            <option>
              Checking Account
            </option>

            <option>
              Savings Account
            </option>

          </select>

        </div>


        <div class="field">

          <label for="withdrawAmount">
            Amount
          </label>

          <input
            id="withdrawAmount"
            type="number"
            min="0"
            step="0.01"
            placeholder="0.00"
            required
          >

        </div>


        <div class="field full">

          <label for="withdrawDestination">
            Destination
          </label>

          <select id="withdrawDestination">

            <option>
              Linked bank account
            </option>

            <option>
              Eligible debit card
            </option>

          </select>

        </div>

      </div>


      <div class="form-actions">

        <button
          class="primary-btn"
          type="submit"
        >
          Continue
        </button>

        <a
          class="secondary-btn"
          href="dashboard.html"
        >
          Cancel
        </a>

      </div>

    </form>

  </section>

</main>


<footer class="page-footer">
  © 2026 Firstviewbank
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>

<script>

document.addEventListener("DOMContentLoaded", async () => {

  if (typeof requireAuth === "function") {
    await requireAuth();
  }

});

</script>

</body>
</html>
