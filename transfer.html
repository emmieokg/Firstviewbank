<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Transfer Money | Firstviewbank</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="bank-pages.css">

</head>

</header>


<main class="page-wrap">

  <a href="dashboard.html" class="back-link">
    <i class="fa-solid fa-arrow-left"></i>
    Back to Dashboard
  </a>

  <p class="page-subtitle">
    Send money between eligible accounts or to a recipient.
  </p>


  <section class="card">

    <h2 class="card-title">
      Transfer Details
    </h2>


    <form
      onsubmit="
        event.preventDefault();
        alert('Transfers are not connected to a real banking provider yet.');
      "
    >

      <div class="form-grid">

        <div class="field">

          <label for="fromAccount">
            From
          </label>

          <select id="fromAccount">

            <option>
              Checking Account
            </option>

            <option>
              Savings Account
            </option>

          </select>

        </div>


        <div class="field">

          <label for="toAccount">
            To
          </label>

          <select id="toAccount">

            <option>
              Firstviewbank
            </option>

            <option>
              Another Bank
            </option>

          </select>

        </div>


        <div class="field">

          <label for="recipient">
            Recipient
          </label>

          <input
            id="recipient"
            type="text"
            placeholder="Name or account identifier"
          >

        </div>


        <div class="field">

          <label for="transferAmount">
            Amount
          </label>

          <input
            id="transferAmount"
            type="number"
            min="0"
            step="0.01"
            placeholder="0.00"
            required
          >

        </div>


        <div class="field full">

          <label for="transferNote">
            Note (optional)
          </label>

          <textarea
            id="transferNote"
            placeholder="Add a note"
          ></textarea>

        </div>

      </div>


      <div class="form-actions">

        <button
          class="primary-btn"
          type="submit"
        >
          Review Transfer
        </button>

        <a
          class="secondary-btn"
          href="dashboard.html"
        >
          Cancel
        </a>

      </div>

    </form>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>

<script>

document.addEventListener("DOMContentLoaded", async () => {

  if (typeof requireAuth === "function") {
    await requireAuth();
  }

});

</script>

</body>
</html>
