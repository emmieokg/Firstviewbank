<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pay Bills | Firstviewbank</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="bank-pages.css">

</head>


</header>


<main class="page-wrap">

  <a href="dashboard.html" class="back-link">
    <i class="fa-solid fa-arrow-left"></i>
    Back to Dashboard
  </a>

  <h1 class="page-title">
    Pay Bills
  </h1>

  <p class="page-subtitle">
    Manage bill payments and scheduled payments.
  </p>



  <section class="card">

    <h2 class="card-title">
      Make a Payment
    </h2>


    <form
      onsubmit="
        event.preventDefault();
        alert('You can't pay bills yet.');
      "
    >

      <div class="form-grid">

        <div class="field">

          <label for="billAccount">
            Pay from
          </label>

          <select id="billAccount">

            <option>
              Checking Account
            </option>

            <option>
              Savings Account
            </option>

          </select>

        </div>


        <div class="field">

          <label for="biller">
            Biller
          </label>

          <input
            id="biller"
            type="text"
            placeholder="Biller name"
            required
          >

        </div>


        <div class="field">

          <label for="billAmount">
            Amount
          </label>

          <input
            id="billAmount"
            type="number"
            min="0"
            step="0.01"
            placeholder="0.00"
            required
          >

        </div>


        <div class="field">

          <label for="dueDate">
            Due date
          </label>

          <input
            id="dueDate"
            type="date"
          >

        </div>

      </div>


      <div class="form-actions">

        <button
          class="primary-btn"
          type="submit"
        >
          Review Payment
        </button>

        <a
          class="secondary-btn"
          href="dashboard.html"
        >
          Cancel
        </a>

      </div>

    </form>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>

<script>

document.addEventListener("DOMContentLoaded", async () => {

  if (typeof requireAuth === "function") {
    await requireAuth();
  }

});

</script>

</body>
</html>
