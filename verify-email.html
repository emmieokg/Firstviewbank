<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verify Email | Firstviewbank</title>

  <link rel="stylesheet" href="style.css">

  <style>

    body {
      background: #f5f7f9;
    }

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    .auth-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      text-align: center;
    }

    .auth-box h1 {
      color: #073b6b;
      font-size: 25px;
      margin-bottom: 10px;
    }

    .auth-subtitle {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .otp-input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      border: 1px solid #bbb;
      border-radius: 10px;
      font-size: 24px;
      text-align: center;
      letter-spacing: 8px;
      outline: none;
    }

    .otp-input:focus {
      border-color: #073b6b;
    }

    .verify-button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #073b6b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .verify-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .resend-button {
      margin-top: 15px;
      border: 0;
      background: none;
      color: #075b91;
      font-weight: 600;
      cursor: pointer;
    }

    .resend-button:disabled {
      color: #999;
      cursor: not-allowed;
    }

    .auth-message {
      min-height: 20px;
      margin-top: 15px;
      font-size: 13px;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #075b91;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

  </style>

</head>

<body>

  <main class="auth-page">

    <div class="auth-box">

      <h1>Verify Your Email</h1>

      <p class="auth-subtitle">
        We sent a 6-digit verification code to
        <strong id="verificationEmail"></strong>.
        Enter the code below to continue.
      </p>


      <form
        onsubmit="event.preventDefault(); verifySignupCode();"
      >

        <input
          type="text"
          id="verificationCode"
          class="otp-input"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          pattern="[0-9]{6}"
          placeholder="000000"
          required
        >


        <button
          type="submit"
          class="verify-button"
          id="verifyButton"
        >
          Verify Email
        </button>

      </form>


      <button
        type="button"
        class="resend-button"
        id="resendButton"
        onclick="resendSignupCode()"
      >
        Resend Code
      </button>


      <div
        id="verificationMessage"
        class="auth-message"
      ></div>


      <a
        href="signup.html"
        class="back-link"
      >
        Back to Sign Up
      </a>

    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="auth.js"></script>

</body>

</html>
