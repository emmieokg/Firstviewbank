<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Firstviewbank</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #f5f7f9;
    }
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }
    .auth-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 5px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }
    .auth-logo {
      text-align: center;
      color: #073b6b;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 25px;
    }
    .auth-box h1 {
      color: #073b6b;
      font-size: 25px;
      margin-bottom: 8px;
    }
    .auth-subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .auth-box label {
      display: block;
      font-size: 13px;
      margin: 15px 0 6px;
    }
    .auth-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #bbb;
      border-radius: 3px;
      font-size: 14px;
    }
    .auth-button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: 0;
      border-radius: 3px;
      background: #073b6b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .auth-message {
      min-height: 20px;
      margin-top: 15px;
      color: #c82333;
      font-size: 13px;
    }
    .auth-footer {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #666;
    }
    .auth-footer a {
      color: #075b91;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="auth-page">
    <div class="auth-box">
      
      <h1>Sign In</h1>
      
      <form onsubmit="event.preventDefault(); signInUser();">
        <label for="loginEmail">
          Email Address
        </label>
        <input
          type="email"
          id="loginEmail"
          autocomplete="email"
          required
        >
        <label for="loginPassword">
          Password
        </label>
        <input
          type="password"
          id="loginPassword"
          autocomplete="current-password"
          required
        >
        <button type="submit" class="auth-button">
          Sign In
        </button>
        <div id="loginMessage" class="auth-message"></div>
      </form>
      <div class="auth-footer">
        Don't have an account?
        <a href="signup.html">Create Account</a>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
</body>
</html>
