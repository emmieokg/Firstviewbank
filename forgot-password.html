<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password | Firstviewbank</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f4f6f8;
      color: #222;
      font-family: "Inter", Arial, sans-serif;
    }

    .auth-header {
      height: 70px;
      background: #fff;
      padding: 0 5%;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #073b6b;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .back-button:hover {
      opacity: 0.8;
    }

    .forgot-container {
      min-height: calc(100vh - 70px);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 20px;
    }

    .forgot-card {
      width: 100%;
      max-width: 450px;
      background: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    .forgot-card h1 {
      color: #073b6b;
      font-size: 28px;
      margin-bottom: 12px;
    }

    .forgot-card p {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #073b6b;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #073b6b;
    }

    .reset-button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #073b6b;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .reset-button:hover {
      opacity: 0.9;
    }

    .back-login {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #073b6b;
      font-size: 14px;
      text-decoration: none;
    }

    .back-login:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .auth-header {
        height: 62px;
        padding: 0 20px;
      }

      .forgot-container {
        min-height: calc(100vh - 62px);
        padding: 30px 15px;
      }

      .forgot-card {
        padding: 30px 22px;
      }

      .forgot-card h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <header class="auth-header">
    <a href="login.html" class="back-button">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Back to Sign In</span>
    </a>
  </header>

  <main class="forgot-container">

    <section class="forgot-card">

      <h1>Forgot Password?</h1>

      <p>
        Enter the email address associated with your Firstviewbank account
        and we'll send you instructions to reset your password.
      </p>

      <form>
        <div class="form-group">
          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            required
          >
        </div>

        <button type="submit" class="reset-button">
          Send Reset Instructions
        </button>
      </form>

      <a href="login.html" class="back-login">
        Back to Sign In
      </a>
    </section>

  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
  const SUPABASE_PUBLISHABLE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const form = document.querySelector("form");
  const emailInput = document.getElementById("email");

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    const email = emailInput.value.trim();

    if (!email) {
      alert("Please enter your email address.");
      return;
    }

    const button = document.querySelector(".reset-button");

    button.disabled = true;
    button.textContent = "Sending...";

    const { error } = await supabaseClient.auth.resetPasswordForEmail(
      email,
      {
        redirectTo: window.location.origin + "/reset-password.html"
      }
    );

    if (error) {
      alert(error.message);
      button.disabled = false;
      button.textContent = "Send Reset Instructions";
      return;
    }

    alert("If an account exists for that email, password reset instructions have been sent.");
    
    button.disabled = false;
    button.textContent = "Send Reset Instructions";
  });
</script>
</body>
</html>
